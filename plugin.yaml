name: discord-ambient
label: Discord (ambient presence)
kind: platform
version: 1.36.0
description: >
  Subclasses the bundled Discord adapter for opt-in, server-admitted
  conversational presence, intentional social silence, verified speaker
  context, bounded catch-up and operator-notice hygiene. The companion
  path requires Hermes framework TurnOrigin, pre_llm_call.ephemeral_context
  and row-addressed delivery receipts (reviewed at 2de7e376); test the
  installed seams before applying this module. Profiles without
  platforms.discord.extra.ambient_presence.enabled keep stock behavior.
author: ghosty
optional_env:
  - name: KLIPY_API_KEY
    description: "Klipy API key for gif_search (profile .env; tool stays hidden without it)"
    password: true
