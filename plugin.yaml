name: discord-ambient
label: Discord (ambient presence)
kind: platform
version: 1.30.0
description: >
  Subclasses the bundled Discord adapter to add opt-in ambient presence.
  A profile may occasionally join conversations it was not mentioned in,
  decline to speak with a [SILENT] sentinel, react, catch up on missed
  rooms, and keep operator plumbing out of public channels. Profiles
  without platforms.discord.extra.ambient_presence.enabled behave like
  stock Discord. Config is YAML under that block, not process-wide env
  vars — under a multiplexed gateway every profile shares one process.
author: ghosty
optional_env:
  - name: KLIPY_API_KEY
    description: "Klipy API key for gif_search (profile .env; tool stays hidden without it)"
    password: true
